name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile *.py

      - name: Run full test suite (no API calls)
        run: |
          python -m unittest \
            tests.test_gameplay \
            tests.test_character_pool \
            tests.test_character_pool_ui \
            tests.test_chat_ui
